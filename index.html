<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>رسالة</title>
<style>
*,*::after,*::before{padding:0;margin:0;box-sizing:border-box}
:root{--dark:#020b14}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI','Arial Unicode MS',Tahoma,sans-serif;background:var(--dark);display:flex;align-items:center;justify-content:center;min-height:100vh;perspective:1000px}

.night{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;filter:blur(0.1vmin);background-image:radial-gradient(ellipse at top,transparent 0%,var(--dark)),radial-gradient(ellipse at bottom,var(--dark),rgba(135,206,235,0.15)),repeating-linear-gradient(220deg,black 0px,black 19px,transparent 19px,transparent 22px),repeating-linear-gradient(189deg,black 0px,black 19px,transparent 19px,transparent 22px),repeating-linear-gradient(148deg,black 0px,black 19px,transparent 19px,transparent 22px),linear-gradient(90deg,#00bfff,#e0f4ff);z-index:0}

.stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur,3s) var(--del,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.1;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}

.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;transition:opacity .3s}
.page--hidden{opacity:0;pointer-events:none}

/* FLOWERS */
.flowers{position:fixed;bottom:0;left:50%;transform:translateX(-50%) scale(0.55);transform-origin:bottom center;z-index:3;pointer-events:none;width:0}
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10;--fl-speed:.8s}
.flower--1{animation:moving-flower-1 4s linear infinite}
.flower--1 .flower__line{height:70vmin;animation-delay:.3s}
.flower--1 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.6s backwards}
.flower--1 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.4s backwards}
.flower--1 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.2s backwards}
.flower--1 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1s backwards}
.flower--1 .flower__line__leaf--5{animation:blooming-leaf-right var(--fl-speed) 1.8s backwards}
.flower--1 .flower__line__leaf--6{animation:blooming-leaf-left var(--fl-speed) 2s backwards}
.flower--2{left:50%;transform:rotate(30deg);animation:moving-flower-2 4s linear infinite}
.flower--2 .flower__line{height:60vmin;animation-delay:.8s}
.flower--2 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.9s backwards}
.flower--2 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.7s backwards}
.flower--2 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.5s backwards}
.flower--2 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.3s backwards}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite}
.flower--3 .flower__line{animation-delay:.9s}
.flower--3 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.5s backwards}
.flower--3 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.3s backwards}
.flower--3 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 2.1s backwards}
.flower--3 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.9s backwards}
.flower__leafs{position:relative;animation:blooming-flower 2s backwards}
.flower__leafs--1{animation-delay:1.1s}
.flower__leafs--2{animation-delay:1.4s}
.flower__leafs--3{animation-delay:1.7s}
.flower__leafs::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:8vmin;height:8vmin;background-color:#87ceeb;filter:blur(10vmin)}
.flower__leaf{position:absolute;bottom:0;left:50%;width:8vmin;height:11vmin;border-radius:51% 49% 47% 53%/44% 45% 55% 69%;background-image:linear-gradient(to top,#5bb8d4,#c9efff);transform-origin:bottom center;opacity:.9;box-shadow:inset 0 0 2vmin rgba(255,255,255,.5)}
.flower__leaf--1{transform:translate(-10%,1%) rotateY(40deg) rotateX(-50deg)}
.flower__leaf--2{transform:translate(-50%,-4%) rotateX(40deg)}
.flower__leaf--3{transform:translate(-90%,0%) rotateY(45deg) rotateX(50deg)}
.flower__leaf--4{width:8vmin;height:8vmin;transform-origin:bottom left;border-radius:4vmin 10vmin 4vmin 4vmin;transform:translate(0%,18%) rotateX(70deg) rotate(-43deg);background-image:linear-gradient(to top,#4aaac2,#c9efff);z-index:1;opacity:.8}
.flower__white-circle{position:absolute;left:-3.5vmin;top:-3vmin;width:9vmin;height:4vmin;border-radius:50%;background-color:#fff}
.flower__white-circle::after{content:"";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:60%;height:60%;border-radius:inherit;background-image:linear-gradient(90deg,#fffb00,#ffce00)}
.flower__line{height:55vmin;width:1.5vmin;background-image:linear-gradient(to left,rgba(0,0,0,.2),transparent,rgba(255,255,255,.2)),linear-gradient(to top,transparent 10%,#1a6f8a,#87ceeb);box-shadow:inset 0 0 2px rgba(0,0,0,.5);animation:grow-flower-tree 4s backwards}
.flower__line__leaf{--w:7vmin;--h:calc(var(--w) + 2vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(26,111,138,.4),#87ceeb)}
.flower__line__leaf--1{transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--2{top:45%;transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--3,.flower__line__leaf--4,.flower__line__leaf--6{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg)}
.flower__line__leaf--4{top:40%}
.flower__line__leaf--5{top:0;transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(.6)}
.flower__line__leaf--6{top:-2%;left:-450%;transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(.6)}
.flower__light{position:absolute;bottom:0;width:1vmin;height:1vmin;background-color:#87ceeb;border-radius:50%;filter:blur(.2vmin);animation:light-ans 4s linear infinite backwards}
.flower__light:nth-child(odd){background-color:#b0e8ff}
.flower__light--1{left:-2vmin;animation-delay:1s}
.flower__light--2{left:3vmin;animation-delay:.5s}
.flower__light--3{left:-6vmin;animation-delay:.3s}
.flower__light--4{left:6vmin;animation-delay:.9s}
.flower__light--5{left:-1vmin;animation-delay:1.5s}
.flower__light--6{left:-4vmin;animation-delay:3s}
.flower__light--7{left:3vmin;animation-delay:2s}
.flower__light--8{left:-6vmin;animation-delay:3.5s}
.flower__grass{--c:#1a8fa0;--line-w:1.5vmin;position:absolute;bottom:12vmin;left:-7vmin;display:flex;flex-direction:column;align-items:flex-end;z-index:20;transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}
.flower__grass--1{animation:moving-grass 2s linear infinite}
.flower__grass--2{left:2vmin;bottom:10vmin;transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);opacity:.8;z-index:0;animation:moving-grass--2 1.5s linear infinite}
.flower__grass--top{width:7vmin;height:10vmin;border-top-right-radius:100%;border-right:var(--line-w) solid var(--c);transform-origin:bottom center;transform:rotate(-2deg)}
.flower__grass--bottom{margin-top:-2px;width:var(--line-w);height:25vmin;background-image:linear-gradient(to top,transparent,var(--c))}
.flower__grass__leaf{--size:10vmin;position:absolute;width:calc(var(--size)*2.1);height:var(--size);border-top-left-radius:var(--size);border-top-right-radius:var(--size);background-image:linear-gradient(to top,transparent,transparent 30%,var(--c));z-index:100}
.flower__grass__leaf--1{top:-6%;left:30%;--size:6vmin;transform:rotate(-20deg);animation:growing-grass-ans--1 2s 2.6s backwards}
@keyframes growing-grass-ans--1{0%{transform-origin:bottom left;transform:rotate(-20deg) scale(0)}}
.flower__grass__leaf--2{top:-5%;left:-110%;--size:6vmin;transform:rotate(10deg);animation:growing-grass-ans--2 2s 2.4s linear backwards}
@keyframes growing-grass-ans--2{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
.flower__grass__leaf--3{top:5%;left:60%;--size:8vmin;transform:rotate(-18deg) rotateX(-20deg);animation:growing-grass-ans--3 2s 2.2s linear backwards}
@keyframes growing-grass-ans--3{0%{transform-origin:bottom left;transform:rotate(-18deg) rotateX(-20deg) scale(0)}}
.flower__grass__leaf--4{top:6%;left:-135%;--size:8vmin;transform:rotate(2deg);animation:growing-grass-ans--4 2s 2s linear backwards}
@keyframes growing-grass-ans--4{0%{transform-origin:bottom right;transform:rotate(2deg) scale(0)}}
.flower__grass__leaf--5{top:20%;left:60%;--size:10vmin;transform:rotate(-24deg) rotateX(-20deg);animation:growing-grass-ans--5 2s 1.8s linear backwards}
@keyframes growing-grass-ans--5{0%{transform-origin:bottom left;transform:rotate(-24deg) rotateX(-20deg) scale(0)}}
.flower__grass__leaf--6{top:22%;left:-180%;--size:10vmin;transform:rotate(10deg);animation:growing-grass-ans--6 2s 1.6s linear backwards}
@keyframes growing-grass-ans--6{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
.flower__grass__leaf--7{top:39%;left:70%;--size:10vmin;transform:rotate(-10deg);animation:growing-grass-ans--7 2s 1.4s linear backwards}
@keyframes growing-grass-ans--7{0%{transform-origin:bottom left;transform:rotate(-10deg) scale(0)}}
.flower__grass__leaf--8{top:40%;left:-215%;--size:11vmin;transform:rotate(10deg);animation:growing-grass-ans--8 2s 1.2s linear backwards}
@keyframes growing-grass-ans--8{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
.flower__grass__overlay{position:absolute;top:-10%;right:0;width:100%;height:100%;background-color:rgba(0,0,0,.5);filter:blur(1.5vmin);z-index:100}
.flower__g-long{--w:2vmin;--h:6vmin;--c:#1a8fa0;position:absolute;bottom:10vmin;left:-3vmin;transform-origin:bottom center;transform:rotate(-30deg) rotateY(-20deg);display:flex;flex-direction:column;align-items:flex-end;animation:flower-g-long-ans 3s linear infinite}
@keyframes flower-g-long-ans{0%,100%{transform:rotate(-30deg) rotateY(-20deg)}50%{transform:rotate(-32deg) rotateY(-20deg)}}
.flower__g-long__top{top:calc(var(--h)*-1);width:calc(var(--w) + 1vmin);height:var(--h);border-top-right-radius:100%;border-right:.7vmin solid var(--c);transform:translate(-.7vmin,1vmin)}
.flower__g-long__bottom{width:var(--w);height:50vmin;transform-origin:bottom center;background-image:linear-gradient(to top,transparent 30%,var(--c));box-shadow:inset 0 0 2px rgba(0,0,0,.5);clip-path:polygon(35% 0,65% 1%,100% 100%,0% 100%)}
.flower__g-right{position:absolute;bottom:6vmin;left:-2vmin;transform-origin:bottom left;transform:rotate(20deg)}
.flower__g-right .leaf{width:30vmin;height:50vmin;border-top-left-radius:100%;border-left:2vmin solid #0a7fa0;background-image:linear-gradient(to bottom,transparent,var(--dark) 60%);-webkit-mask-image:linear-gradient(to top,transparent 30%,#0a7fa0 60%);mask-image:linear-gradient(to top,transparent 30%,#0a7fa0 60%)}
.flower__g-right--1{animation:flower-g-right-ans 2.5s linear infinite}
.flower__g-right--2{left:5vmin;transform:rotateY(-180deg);animation:flower-g-right-ans--2 3s linear infinite}
.flower__g-right--2 .leaf{height:75vmin;filter:blur(.3vmin);opacity:.8}
@keyframes flower-g-right-ans{0%,100%{transform:rotate(20deg)}50%{transform:rotate(24deg) rotateX(-20deg)}}
@keyframes flower-g-right-ans--2{0%,100%{transform:rotateY(-180deg) rotate(0deg) rotateX(-20deg)}50%{transform:rotateY(-180deg) rotate(6deg) rotateX(-20deg)}}
.flower__g-front{position:absolute;bottom:6vmin;left:2.5vmin;z-index:100;transform-origin:bottom center;transform:rotate(-28deg) rotateY(30deg) scale(1.04);animation:flower__g-front-ans 2s linear infinite}
@keyframes flower__g-front-ans{0%,100%{transform:rotate(-28deg) rotateY(30deg) scale(1.04)}50%{transform:rotate(-35deg) rotateY(40deg) scale(1.04)}}
.flower__g-front__line{width:.3vmin;height:20vmin;background-image:linear-gradient(to top,transparent,#0a7fa0,transparent 100%);position:relative}
.flower__g-front__leaf-wrapper{position:absolute;top:0;left:0;transform-origin:bottom left;transform:rotate(10deg)}
.flower__g-front__leaf-wrapper:nth-child(even){left:0;transform:rotateY(-180deg) rotate(5deg);animation:flower__g-front__leaf-left-ans 1s ease-in backwards}
.flower__g-front__leaf-wrapper:nth-child(odd){animation:flower__g-front__leaf-ans 1s ease-in backwards}
.flower__g-front__leaf-wrapper--1{top:-8vmin;transform:scale(.7);animation:flower__g-front__leaf-ans 1s 5.5s ease-in backwards!important}
.flower__g-front__leaf-wrapper--2{top:-8vmin;transform:rotateY(-180deg) scale(.7)!important;animation:flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards!important}
.flower__g-front__leaf-wrapper--3{top:-3vmin;animation:flower__g-front__leaf-ans 1s 4.6s ease-in backwards}
.flower__g-front__leaf-wrapper--4{top:-3vmin;transform:rotateY(-180deg) scale(.9)!important;animation:flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards!important}
@keyframes flower__g-front__leaf-left-ans-2{0%{transform:rotateY(-180deg) scale(0)}}
.flower__g-front__leaf-wrapper--5,.flower__g-front__leaf-wrapper--6{top:2vmin}
.flower__g-front__leaf-wrapper--7,.flower__g-front__leaf-wrapper--8{top:6.5vmin}
.flower__g-front__leaf-wrapper--2{animation-delay:5.2s!important}
.flower__g-front__leaf-wrapper--3{animation-delay:4.9s!important}
.flower__g-front__leaf-wrapper--5{animation-delay:4.3s!important}
.flower__g-front__leaf-wrapper--6{animation-delay:4.1s!important}
.flower__g-front__leaf-wrapper--7{animation-delay:3.8s!important}
.flower__g-front__leaf-wrapper--8{animation-delay:3.5s!important}
@keyframes flower__g-front__leaf-ans{0%{transform:rotate(10deg) scale(0)}}
@keyframes flower__g-front__leaf-left-ans{0%{transform:rotateY(-180deg) rotate(5deg) scale(0)}}
.flower__g-front__leaf{width:10vmin;height:10vmin;border-radius:100% 0% 0% 100%/100% 100% 0% 0%;box-shadow:inset 0 2px 1vmin rgba(135,206,235,.2);background-image:linear-gradient(to bottom left,transparent,var(--dark)),linear-gradient(to bottom right,#1a8fa0 50%,transparent 50%);-webkit-mask-image:linear-gradient(to bottom right,#1a8fa0 50%,transparent 50%);mask-image:linear-gradient(to bottom right,#1a8fa0 50%,transparent 50%)}
.flower__g-fr{position:absolute;bottom:-4vmin;left:0;transform-origin:bottom left;z-index:10;animation:flower__g-fr-ans 2s linear infinite}
@keyframes flower__g-fr-ans{0%,100%{transform:rotate(2deg)}50%{transform:rotate(4deg)}}
.flower__g-fr .leaf{width:30vmin;height:50vmin;border-top-left-radius:100%;border-left:2vmin solid #0a7fa0;-webkit-mask-image:linear-gradient(to top,transparent 25%,#0a7fa0 50%);mask-image:linear-gradient(to top,transparent 25%,#0a7fa0 50%);position:relative;z-index:1}
.flower__g-fr__leaf{position:absolute;top:0;left:0;width:10vmin;height:10vmin;border-radius:100% 0% 0% 100%/100% 100% 0% 0%;box-shadow:inset 0 2px 1vmin rgba(135,206,235,.2);background-image:linear-gradient(to bottom left,transparent,var(--dark) 98%),linear-gradient(to bottom right,#87ceeb 45%,transparent 50%);-webkit-mask-image:linear-gradient(135deg,#1a8fa0 40%,transparent 50%);mask-image:linear-gradient(135deg,#1a8fa0 40%,transparent 50%)}
.flower__g-fr__leaf--1{left:20vmin;transform:rotate(45deg);animation:flower__g-fr-leaft-ans-1 .5s 5.2s linear backwards}
@keyframes flower__g-fr-leaft-ans-1{0%{transform-origin:left;transform:rotate(45deg) scale(0)}}
.flower__g-fr__leaf--2{left:12vmin;top:-7vmin;transform:rotate(25deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-6 .5s 5s linear backwards}
.flower__g-fr__leaf--3{left:15vmin;top:6vmin;transform:rotate(55deg);animation:flower__g-fr-leaft-ans-5 .5s 4.8s linear backwards}
.flower__g-fr__leaf--4{left:6vmin;top:-2vmin;transform:rotate(25deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-6 .5s 4.6s linear backwards}
.flower__g-fr__leaf--5{left:10vmin;top:14vmin;transform:rotate(55deg);animation:flower__g-fr-leaft-ans-5 .5s 4.4s linear backwards}
@keyframes flower__g-fr-leaft-ans-5{0%{transform-origin:left;transform:rotate(55deg) scale(0)}}
.flower__g-fr__leaf--6{left:0;top:6vmin;transform:rotate(25deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-6 .5s 4.2s linear backwards}
@keyframes flower__g-fr-leaft-ans-6{0%{transform-origin:right;transform:rotate(25deg) rotateY(-180deg) scale(0)}}
.flower__g-fr__leaf--7{left:5vmin;top:22vmin;transform:rotate(45deg);animation:flower__g-fr-leaft-ans-7 .5s 4s linear backwards}
@keyframes flower__g-fr-leaft-ans-7{0%{transform-origin:left;transform:rotate(45deg) scale(0)}}
.flower__g-fr__leaf--8{left:-4vmin;top:15vmin;transform:rotate(15deg) rotateY(-180deg);animation:flower__g-fr-leaft-ans-8 .5s 3.8s linear backwards}
@keyframes flower__g-fr-leaft-ans-8{0%{transform-origin:right;transform:rotate(15deg) rotateY(-180deg) scale(0)}}
.long-g{position:absolute;bottom:25vmin;left:-42vmin;transform-origin:bottom left}
.long-g--1{bottom:0;transform:scale(.8) rotate(-5deg)}
.long-g--1 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 40%,#0a7fa0 80%)!important;mask-image:linear-gradient(to top,transparent 40%,#0a7fa0 80%)!important}
.long-g--1 .leaf--1{--w:5vmin;--h:60vmin;left:-2vmin;transform:rotate(3deg) rotateY(-180deg)}
.long-g--2,.long-g--3{bottom:-3vmin;left:-35vmin;transform-origin:center;transform:scale(.6) rotateX(60deg)}
.long-g--2 .leaf,.long-g--3 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 50%,#0a7fa0 80%)!important;mask-image:linear-gradient(to top,transparent 50%,#0a7fa0 80%)!important}
.long-g--2 .leaf--1,.long-g--3 .leaf--1{left:-1vmin;transform:rotateY(-180deg)}
.long-g--3{left:-17vmin;bottom:0}
.long-g--3 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 40%,#0a7fa0 80%)!important;mask-image:linear-gradient(to top,transparent 40%,#0a7fa0 80%)!important}
.long-g--4{left:25vmin;bottom:-3vmin;transform-origin:center;transform:scale(.6) rotateX(60deg)}
.long-g--4 .leaf{-webkit-mask-image:linear-gradient(to top,transparent 50%,#0a7fa0 80%)!important;mask-image:linear-gradient(to top,transparent 50%,#0a7fa0 80%)!important}
.long-g--5{left:42vmin;bottom:0;transform:scale(.8) rotate(2deg)}
.long-g--6{left:0;bottom:-20vmin;z-index:100;filter:blur(.3vmin);transform:scale(.8) rotate(2deg)}
.long-g--7{left:35vmin;bottom:20vmin;z-index:-1;filter:blur(.3vmin);transform:scale(.6) rotate(2deg);opacity:.7}
.long-g .leaf{--w:15vmin;--h:40vmin;--c:#1aaa15;position:absolute;bottom:0;width:var(--w);height:var(--h);border-top-left-radius:100%;border-left:2vmin solid var(--c);-webkit-mask-image:linear-gradient(to top,transparent 20%,var(--dark));mask-image:linear-gradient(to top,transparent 20%,var(--dark));transform-origin:bottom center}
.long-g .leaf--0{left:2vmin;animation:leaf-ans-1 4s linear infinite}
.long-g .leaf--1{--w:5vmin;--h:60vmin;animation:leaf-ans-1 4s linear infinite}
.long-g .leaf--2{--w:10vmin;--h:40vmin;left:-.5vmin;bottom:5vmin;transform-origin:bottom left;transform:rotateY(-180deg);animation:leaf-ans-2 3s linear infinite}
.long-g .leaf--3{--w:5vmin;--h:30vmin;left:-1vmin;bottom:3.2vmin;transform-origin:bottom left;transform:rotate(-10deg) rotateY(-180deg);animation:leaf-ans-3 3s linear infinite}
@keyframes leaf-ans-1{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.1)}}
@keyframes leaf-ans-2{0%,100%{transform:rotateY(-180deg) rotate(5deg)}50%{transform:rotateY(-180deg) rotate(0deg) scale(1.1)}}
@keyframes leaf-ans-3{0%,100%{transform:rotate(-10deg) rotateY(-180deg)}50%{transform:rotate(-20deg) rotateY(-180deg)}}
.grow-ans{animation:grow-ans 2s var(--d) backwards}
@keyframes grow-ans{0%{transform:scale(0);opacity:0}}
@keyframes light-ans{0%{opacity:0;transform:translateY(0)}25%{opacity:1;transform:translateY(-5vmin) translateX(-2vmin)}50%{opacity:1;transform:translateY(-15vmin) translateX(2vmin);filter:blur(.2vmin)}75%{transform:translateY(-20vmin) translateX(-2vmin);filter:blur(.2vmin)}100%{transform:translateY(-30vmin);opacity:0;filter:blur(1vmin)}}
@keyframes moving-flower-1{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes moving-flower-2{0%,100%{transform:rotate(18deg)}50%{transform:rotate(14deg)}}
@keyframes moving-flower-3{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-20deg) rotateY(-10deg)}}
@keyframes blooming-leaf-right{0%{transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(0)}}
@keyframes blooming-leaf-left{0%{transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(0)}}
@keyframes grow-flower-tree{0%{height:0;border-radius:1vmin}}
@keyframes blooming-flower{0%{transform:scale(0)}}
@keyframes moving-grass{0%,100%{transform:rotate(-48deg) rotateY(40deg)}50%{transform:rotate(-50deg) rotateY(40deg)}}
@keyframes moving-grass--2{0%,100%{transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg)}50%{transform:scale(.5) rotate(79deg) rotateX(10deg) rotateY(-200deg)}}
.growing-grass{animation:growing-grass-ans 1s 2s backwards}
@keyframes growing-grass-ans{0%{transform:scale(0)}}

/* PARTICLES */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.petal{position:absolute;opacity:0;animation:fall var(--f,8s) var(--d,0s) linear infinite;font-size:var(--s,14px)}
@keyframes fall{0%{opacity:0;transform:translateY(-20px) rotate(0deg)}10%{opacity:.8}90%{opacity:.4}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}

/* === FIX 1: card hidden at start, fades in at 3.5s === */
.card{
  position:relative;z-index:10;
  background:rgba(2,11,20,0.78);
  border:1px solid rgba(135,206,235,0.3);
  border-radius:24px;
  padding:36px 28px;
  max-width:320px;width:90%;
  text-align:center;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 60px rgba(135,206,235,0.1);
  opacity:0;
  transform:translateY(20px);
  transition:opacity 1.1s ease,transform 1.1s ease;
}
.card.visible{opacity:1;transform:translateY(0)}

.card-icon{font-size:30px;margin-bottom:10px}
.card-subtitle{font-size:11px;color:rgba(135,206,235,.5);letter-spacing:.5px;margin-bottom:10px}
.card-message{font-size:20px;line-height:1.85;color:#e0f4ff;margin-bottom:8px}
.card-sub{font-size:12px;color:rgba(176,224,255,.48);margin-bottom:26px;line-height:1.7}

.btns{display:flex;gap:12px;justify-content:center}
.btn{font-size:14px;font-weight:700;border:none;border-radius:50px;padding:11px 30px;cursor:pointer;transition:transform .2s;font-family:inherit;touch-action:manipulation}
.btn-yes{background:linear-gradient(135deg,#87ceeb,#4fa8d5);color:#020b14;box-shadow:0 4px 20px rgba(135,206,235,.35)}
.btn-yes:active{transform:scale(.95)}
/* FIX 2: no button positioning done entirely via JS with clamped mobile bounds */
.btn-no{background:transparent;
    color:rgba(135,206,235,.65);
    border:1px solid rgba(135,206,235,.25)}


/* TELEPORT */
.teleport-overlay{position:fixed;inset:0;z-index:1000;pointer-events:none;background:transparent;transition:background .3s}
.teleport-overlay.active{pointer-events:all}
.ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:10px;height:10px;border-radius:50%;border:3px solid #87ceeb;opacity:0}

/* PAGE 2 */
.p2-card{
  position:relative;z-index:10;
  background:rgba(2,11,20,0.82);
  border:1px solid rgba(135,206,235,.35);
  border-radius:24px;
  padding:40px 28px;
  max-width:340px;width:90%;
  text-align:center;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 80px rgba(135,206,235,.12);
  opacity:0;transform:scale(.9);
  transition:opacity .9s,transform .9s;
}
.p2-card.visible{opacity:1;transform:scale(1)}
.p2-big{font-size:46px;margin-bottom:4px;animation:floatUp 4s ease-in-out infinite}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.p2-title{font-size:22px;color:#e0f4ff;margin-bottom:12px;line-height:1.65}
.p2-body{font-size:13px;color:rgba(176,224,255,.6);line-height:1.85;margin-bottom:22px}
.p2-footer{font-size:14px;color:rgba(135,206,235,.48)}
.heart-burst{display:flex;gap:8px;justify-content:center;margin-bottom:16px;font-size:18px;animation:hearts 2.5s ease-in-out infinite}
@keyframes hearts{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}

/* animations paused until JS starts them */
.not-loaded *{animation-play-state:paused!important}
</style>
</head>

<script>
// ===================================================================
// FIX 3: Use window.addEventListener('load') — works in VSCode
//         offline preview, unlike the shorthand onload= assignment
// ===================================================================
window.addEventListener('load', function() {

  // unpause CSS animations (they're all paused via .not-loaded)
  document.body.classList.remove('not-loaded');

  // --- build stars ---
  var starsEl = document.getElementById('stars');
  for (var i = 0; i < 80; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left   = (Math.random() * 100) + '%';
    s.style.top    = (Math.random() * 70)  + '%';
    s.style.width  = (Math.random() * 2 + 1) + 'px';
    s.style.height = s.style.width;
    s.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
    s.style.setProperty('--del', (Math.random() * 4)     + 's');
    starsEl.appendChild(s);
  }

  // --- build petals ---
  var petalsEl = document.getElementById('particles');
  var symbols = ['🌸','✿','❀','🌷','·','✦'];
  for (var j = 0; j < 22; j++) {
    var p = document.createElement('div');
    p.className   = 'petal';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left  = (Math.random() * 100) + '%';
    p.style.setProperty('--f', (Math.random() * 6 + 6) + 's');
    p.style.setProperty('--d', (Math.random() * 8)     + 's');
    p.style.setProperty('--s', (Math.random() * 10 + 10) + 'px');
    petalsEl.appendChild(p);
  }

  // --- FIX 1: reveal card after 3.5s so flowers bloom first ---
  setTimeout(function() {
    document.getElementById('mainCard').classList.add('visible');
  }, 3500);

 // --- FIX 2: no-button escapes but stays inside ANY mobile screen bounds ---
// --- FIX 2: Restricted range to 250px width and 500px height ---
document.getElementById('noBtn').addEventListener('click', function() {
  var btn = this;
  
  // تحديد المدى المطلوب
  var rangeW = 250;
  var rangeH = 500;

  // حساب نقطة البداية ليكون المدى في منتصف الشاشة تقريباً
  // (عرض الشاشة - المدى) / 2
  var startX = (window.innerWidth - rangeW) / 2;
  var startY = (window.innerHeight - rangeH) / 2;

  // توليد موقع عشوائي داخل هذا المدى فقط
  var nx = startX + (Math.random() * (rangeW - btn.offsetWidth));
  var ny = startY + (Math.random() * (rangeH - btn.offsetHeight));

  // تطبيق الإحداثيات
  btn.style.position = 'fixed';
  btn.style.margin = '0';
  btn.style.left = nx + 'px';
  btn.style.top = ny + 'px';
  btn.style.zIndex = '999';
  btn.style.transition = 'left .3s ease, top .3s ease';
});

  // --- yes button ---
  document.getElementById('yesBtn').addEventListener('click', startTeleport);
});

function startTeleport() {
  var ov    = document.getElementById('teleportOverlay');
  var r1    = document.getElementById('r1');
  var r2    = document.getElementById('r2');
  var r3    = document.getElementById('r3');
  var rings = [r1, r2, r3];

  ov.classList.add('active');

  // expanding rings
  rings.forEach(function(r, i) {
    setTimeout(function() {
      r.style.transition = 'transform .6s ease-out, opacity .6s';
      r.style.transform  = 'translate(-50%,-50%) scale(' + (80 + i * 60) + ')';
      r.style.opacity    = '0';
    }, i * 120);
  });

  // blue flash
  setTimeout(function() { ov.style.background = 'rgba(135,206,235,0.95)'; }, 500);

  // switch pages
  setTimeout(function() {
    document.getElementById('page1').classList.add('page--hidden');
    document.getElementById('page2').classList.remove('page--hidden');
    ov.style.background = 'transparent';
  }, 780);

  // show page 2 card + extra petals
  setTimeout(function() {
    ov.classList.remove('active');
    rings.forEach(function(r) {
      r.style.transform = 'translate(-50%,-50%) scale(0)';
      r.style.opacity   = '0';
    });
    document.getElementById('p2card').classList.add('visible');

    var petalsEl = document.getElementById('particles');
    var sym2 = ['🌸','💙','✿','🌷'];
    for (var k = 0; k < 10; k++) {
      var p = document.createElement('div');
      p.className   = 'petal';
      p.textContent = sym2[Math.floor(Math.random() * sym2.length)];
      p.style.left  = (Math.random() * 100) + '%';
      p.style.setProperty('--f', (Math.random() * 3 + 3) + 's');
      p.style.setProperty('--d', '0s');
      p.style.setProperty('--s', (Math.random() * 12 + 14) + 'px');
      petalsEl.appendChild(p);
    }
  }, 1150);
}
</script>
